<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- TO-220 through-hole package with mounting tab. Default pin names are
       MOSFET (G D S); swap via substitute_pin_names() for other parts. -->
  <rect width="40" height="40" fill="#ffffff"/>
  <text x="20" y="5.2" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#111">TO-220</text>
  <g fill="none" stroke="#111" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="7" width="18" height="7" rx="1"/>
    <circle cx="20" cy="10.5" r="1.6"/>
    <rect x="11" y="14" width="18" height="12"/>
    <line x1="15" y1="26" x2="15" y2="32"/>
    <line x1="20" y1="26" x2="20" y2="32"/>
    <line x1="25" y1="26" x2="25" y2="32"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">
    <g font-size="2.2">
      <text x="15" y="35">1</text>
      <text x="20" y="35">2</text>
      <text x="25" y="35">3</text>
    </g>
    <g font-size="2.7" font-weight="bold">
      <text class="pin-name" x="15" y="39">G</text>
      <text class="pin-name" x="20" y="39">D</text>
      <text class="pin-name" x="25" y="39">S</text>
    </g>
  </g>
</svg>
