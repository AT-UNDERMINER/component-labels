<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- DO-41 axial diode. Cathode band marks pin K; A = anode. -->
  <rect width="40" height="40" fill="#ffffff"/>
  <text x="20" y="9" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#111">DO-41</text>
  <g fill="none" stroke="#111" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="2" y1="21" x2="11" y2="21"/>
    <line x1="29" y1="21" x2="38" y2="21"/>
    <rect x="11" y="16" width="18" height="10" rx="1.5"/>
  </g>
  <rect x="24.5" y="16" width="2.4" height="10" fill="#111"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111" font-size="2.9" font-weight="bold">
    <text class="pin-name" x="6" y="32">A</text>
    <text class="pin-name" x="34" y="32">K</text>
  </g>
</svg>
