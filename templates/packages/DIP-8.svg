<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- DIP-8 through-hole IC. Pin 1 at top-left (notch + dot); numbering runs
       down the left side then up the right. IC pin names are part-specific. -->
  <rect width="40" height="40" fill="#ffffff"/>
  <text x="20" y="5.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#111">DIP-8</text>
  <g fill="none" stroke="#111" stroke-width="0.6" stroke-linejoin="round">
    <path d="M11 7 L17 7 A3 1.8 0 0 1 23 7 L29 7 L29 33 L11 33 Z"/>
    <line x1="9" y1="10.25" x2="11" y2="10.25"/>
    <line x1="9" y1="16.75" x2="11" y2="16.75"/>
    <line x1="9" y1="23.25" x2="11" y2="23.25"/>
    <line x1="9" y1="29.75" x2="11" y2="29.75"/>
    <line x1="29" y1="10.25" x2="31" y2="10.25"/>
    <line x1="29" y1="16.75" x2="31" y2="16.75"/>
    <line x1="29" y1="23.25" x2="31" y2="23.25"/>
    <line x1="29" y1="29.75" x2="31" y2="29.75"/>
  </g>
  <circle cx="14" cy="11.2" r="0.9" fill="#111"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" fill="#111">
    <g text-anchor="end">
      <text x="8" y="11">1</text>
      <text x="8" y="17.5">2</text>
      <text x="8" y="24">3</text>
      <text x="8" y="30.5">4</text>
    </g>
    <g text-anchor="start">
      <text x="32" y="11">8</text>
      <text x="32" y="17.5">7</text>
      <text x="32" y="24">6</text>
      <text x="32" y="30.5">5</text>
    </g>
  </g>
</svg>
