<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- TO-3 metal-can power package: oval flange with two mounting holes, two
       leads (default BJT B/E), metal case = collector. -->
  <rect width="40" height="40" fill="#ffffff"/>
  <text x="20" y="6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#111">TO-3</text>
  <g fill="none" stroke="#111" stroke-width="0.6" stroke-linejoin="round">
    <rect x="3" y="13" width="34" height="16" rx="8"/>
    <ellipse cx="20" cy="21" rx="9" ry="6.5"/>
    <circle cx="7.5" cy="21" r="1.6"/>
    <circle cx="32.5" cy="21" r="1.6"/>
    <circle cx="17" cy="22.2" r="0.9"/>
    <circle cx="23" cy="22.2" r="0.9"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">
    <g font-size="2.6" font-weight="bold">
      <text class="pin-name" x="17" y="18.6">B</text>
      <text class="pin-name" x="23" y="18.6">E</text>
    </g>
    <g font-size="1.8">
      <text x="17" y="26.2">1</text>
      <text x="23" y="26.2">2</text>
    </g>
    <text x="20" y="36.5" font-size="2.3">CASE = C</text>
  </g>
</svg>
