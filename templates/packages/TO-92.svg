<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- TO-92 through-hole package. Default pin names are BJT (C B E); the
       class="pin-name" labels can be swapped (e.g. MOSFET D G S) via
       core.label_builder.substitute_pin_names(). -->
  <rect width="40" height="40" fill="#ffffff"/>
  <text x="20" y="5.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#111">TO-92</text>
  <g fill="none" stroke="#111" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 23 A11 11 0 0 1 31 23 Z"/>
    <line x1="14" y1="23" x2="14" y2="31"/>
    <line x1="20" y1="23" x2="20" y2="31"/>
    <line x1="26" y1="23" x2="26" y2="31"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">
    <g font-size="2.2">
      <text x="14" y="34.6">1</text>
      <text x="20" y="34.6">2</text>
      <text x="26" y="34.6">3</text>
    </g>
    <g font-size="2.7" font-weight="bold">
      <text class="pin-name" x="14" y="38.6">C</text>
      <text class="pin-name" x="20" y="38.6">B</text>
      <text class="pin-name" x="26" y="38.6">E</text>
    </g>
  </g>
</svg>
